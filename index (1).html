<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Czy tutoring jest dla Ciebie? | WOiG UG</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#12334a;background:#eaf4f6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#d8eef2,#f8fbfa 55%,#d8e9e5);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:24px 15px 50px}.top{font-weight:750;letter-spacing:.08em;color:#0e6275;font-size:13px;margin:12px 0 18px}.panel{background:white;border-radius:24px;padding:clamp(22px,5vw,44px);box-shadow:0 12px 40px #17485b20}.eyebrow{color:#18788a;text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:.1em}h1{font-size:clamp(29px,5vw,45px);line-height:1.1;margin:12px 0 16px}h2{font-size:clamp(22px,4vw,30px);line-height:1.25}p{line-height:1.6}.muted{color:#526b78}.pill{display:inline-block;background:#d9f0e7;color:#155c4e;padding:8px 12px;border-radius:20px;font-weight:700;font-size:13px}.btn{background:#096e82;color:white;border:0;border-radius:12px;padding:14px 22px;font-weight:750;font-size:16px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e6f1f3;color:#125368}.buttons{display:flex;gap:10px;justify-content:space-between;margin-top:26px}.answers{display:grid;gap:10px;margin-top:24px}.answer{width:100%;border:2px solid #d9e6e9;background:white;color:#173a4b;border-radius:13px;text-align:left;padding:17px;font:inherit;cursor:pointer}.answer.selected{border-color:#087d86;background:#e7f7f3;font-weight:700}.progress{height:8px;background:#e6eff1;border-radius:9px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#1b8c94;transition:width .2s}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.card{border-radius:14px;padding:16px;background:#edf6f6}.card b{display:block;margin-bottom:6px}.note{font-size:13px;color:#59717c}.resultbox{background:#edf7f3;border-radius:16px;padding:20px;margin:20px 0}ul{line-height:1.8;padding-left:23px}.footer{text-align:center;color:#607b85;font-size:12px;margin:22px}button:focus-visible{outline:3px solid #e6a647;outline-offset:3px}@media(max-width:480px){.cards{grid-template-columns:1fr}.buttons .btn{flex:1;padding:13px 8px}}</style></head><body><main class="wrap"><div class="top">WYDZIAŁ OCEANOGRAFII I GEOGRAFII · UNIWERSYTET GDAŃSKI</div><section class="panel" id="app" aria-live="polite"></section><div class="footer">Quiz orientacyjny · Nie zbieramy ani nie zapisujemy odpowiedzi</div></main><script>
const questions=[
['Co najbardziej chciał(a)byś zmienić w swoim studiowaniu?','Lepiej poznać swoje możliwości','Mieć przestrzeń na własne pomysły','Wiedzieć, dokąd zmierzam','Lepiej radzić sobie z wyzwaniami'],
['Co robisz, gdy zainteresuje Cię temat spoza programu zajęć?','Zastanawiam się, dlaczego mnie ciekawi','Chcę go samodzielnie zbadać','Sprawdzam, do czego może mi się przydać','Szukam kogoś, z kim mogę go omówić'],
['Które zdanie najlepiej Cię opisuje?','Mam potencjał, ale nie zawsze go dostrzegam','Mam mnóstwo pomysłów, lecz trudno mi je realizować','Mam wiele możliwości i trudno mi wybrać','Czasem brakuje mi motywacji lub pewności siebie'],
['Gdybyś mógł/mogła zrealizować dowolny projekt, co byś wybrał(a)?','Coś, co pozwoli mi odkryć własne talenty','Badania lub projekt związany z moją pasją','Projekt przydatny w przyszłej karierze','Wyzwanie, które pozwoli mi przełamać bariery'],
['Co najbardziej przeszkadza Ci w realizowaniu celów?','Nie wiem, jakie są moje mocne strony','Nie wiem, od czego zacząć','Trudno mi wybrać priorytety','Odkładam działania albo wątpię w siebie'],
['Jak wyobrażasz sobie idealną rozmowę z tutorem?','Pomaga mi lepiej zrozumieć siebie','Rozmawiamy o moich zainteresowaniach','Analizujemy możliwe ścieżki rozwoju','Szukamy sposobów na pokonanie trudności'],
['Która sytuacja najbardziej Cię ekscytuje?','Odkrycie nieznanej wcześniej umiejętności','Możliwość udziału w prawdziwych badaniach','Perspektywa ciekawego stażu lub pracy','Pokonanie wyzwania, które wydawało się trudne'],
['Co chciał(a)byś osiągnąć w najbliższym semestrze?','Lepiej poznać siebie','Zrealizować własny pomysł','Przygotować plan na przyszłość','Wypracować skuteczniejsze nawyki'],
['Jak reagujesz na niepowodzenie?','Zastanawiam się, czego mnie nauczyło','Szukam innego sposobu rozwiązania problemu','Analizuję, czy warto zmienić kierunek','Potrzebuję odzyskać motywację'],
['Czego najbardziej brakuje Ci na uczelni?','Przestrzeni na rozmowę o własnym rozwoju','Możliwości rozwijania indywidualnych zainteresowań','Pomocy w podejmowaniu ważnych decyzji','Indywidualnego wsparcia w realizacji celów'],
['Co najbardziej chciał(a)byś usłyszeć od tutora?','Co sprawia, że właśnie to jest dla Ciebie ważne?','Jak możesz sprawdzić swój pomysł w praktyce?','Jakie możliwości chcesz rozważyć?','Jaki mały krok możesz zrobić już teraz?'],
['Dokończ zdanie: „Po tutoringu chciał(a)bym…”','Lepiej rozumieć siebie','Mieć zrealizowany własny projekt','Wiedzieć, w jakim kierunku iść','Mieć więcej odwagi i sprawczości']];
const profiles=[
{name:'Odkrywca potencjału',icon:'✨',subtitle:'Poznaj swoje mocne strony i zasoby.',description:'Tutoring rozwojowy może pomóc Ci rozpoznać własne talenty, wartości i motywacje oraz świadomie wykorzystywać je podczas studiów.',topics:['Moje mocne strony i talenty','Co daje mi satysfakcję?','Jakie wartości są dla mnie ważne?'],reflection:'Kiedy ostatnio zrobiłeś lub zrobiłaś coś, z czego naprawdę jesteś dumny lub dumna?'},
{name:'Badacz i twórca',icon:'🔬',subtitle:'Rozwijaj swoje zainteresowania i pomysły.',description:'Tutoring akademicki może być przestrzenią do pogłębiania zainteresowań, planowania projektu naukowego i rozwijania samodzielności badawczej.',topics:['Mój pierwszy projekt badawczy','Jak rozwijać zainteresowania naukowe?','Od pytania badawczego do działania'],reflection:'Jakie pytanie dotyczące świata chciał(a)byś zbadać?'},
{name:'Poszukiwacz kierunku',icon:'🧭',subtitle:'Uporządkuj możliwości i zaplanuj przyszłość.',description:'Tutoring może pomóc Ci przyjrzeć się priorytetom, rozważyć różne ścieżki i zaplanować dalszy rozwój.',topics:['Co po studiach?','Jak wybrać ścieżkę rozwoju?','Jak połączyć pasje z przyszłą pracą?'],reflection:'Jak chciał(a)byś, żeby wyglądał Twój rozwój za trzy lata?'},
{name:'Architekt zmiany',icon:'🚀',subtitle:'Zamieniaj cele w konkretne działania.',description:'Tutoring rozwojowy może pomóc Ci wyznaczać realne cele, analizować przeszkody i próbować nowych sposobów działania.',topics:['Od pomysłu do pierwszego kroku','Jak pracować nad motywacją?','Jak budować sprawczość?'],reflection:'Jaki jeden mały krok możesz wykonać jeszcze w tym tygodniu?'}];
const app=document.getElementById('app');let step=-1;let answers=Array(questions.length).fill(null);
function render(){if(step===-1){app.innerHTML=`<span class="pill">12 pytań · 4 profile · 4–6 minut</span><h1>Czy tutoring jest dla Ciebie?</h1><p class="muted">12 pytań. 4 profile. Jedna droga – Twoja!</p><p><b>To nie jest test wiedzy ani ocena Twoich możliwości.</b> Nie ma dobrych ani złych odpowiedzi. Wynik podpowie Ci, w jakim obszarze tutoring może wspierać Twój rozwój.</p><div class="cards">${profiles.map(p=>`<div class="card"><b>${p.icon} ${p.name}</b><small>${p.subtitle}</small></div>`).join('')}</div><p class="note">Odpowiadasz anonimowo. Nie podajesz nazwiska, e-maila ani numeru albumu.</p><button class="btn" id="start">Rozpocznij quiz →</button>`;document.getElementById('start').onclick=()=>{step=0;render()};return}
if(step===questions.length){const score=[0,0,0,0];answers.forEach(a=>score[a]++);const sorted=[0,1,2,3].sort((a,b)=>score[b]-score[a]);const p=profiles[sorted[0]];app.innerHTML=`<div class="eyebrow">Twój profil tutoringowy</div><h1>${p.icon} ${p.name}</h1><p><b>${p.subtitle}</b></p><p>${p.description}</p><div class="resultbox"><b>Tematy, które możesz poruszyć z tutorem:</b><ul>${p.topics.map(t=>`<li>${t}</li>`).join('')}</ul><b>Twoje pierwsze pytanie tutoringowe:</b><p>${p.reflection}</p></div>${score[sorted[1]]>=3?`<p class="muted">Bliski jest Ci również profil <b>${profiles[sorted[1]].name}</b>. Możesz łączyć różne obszary rozwoju.</p>`:''}<p class="note">Quiz ma charakter orientacyjny, nie diagnostyczny. Każdy student może skorzystać z tutoringu, niezależnie od wyniku.</p><div class="buttons"><button class="btn secondary" id="again">Rozpocznij ponownie</button><button class="btn" id="copy">Skopiuj wynik</button></div><p class="note" id="copy-status" role="status"></p>`;document.getElementById('again').onclick=()=>{step=-1;answers.fill(null);render()};document.getElementById('copy').onclick=async()=>{const content=`Mój profil tutoringowy: ${p.name}\n${p.subtitle}\n${p.description}\nTematy: ${p.topics.join('; ')}\nPytanie: ${p.reflection}`;try{await navigator.clipboard.writeText(content);document.getElementById('copy-status').textContent='Wynik skopiowany.'}catch{document.getElementById('copy-status').textContent='Nie udało się skopiować automatycznie.'}};return}
const q=questions[step];app.innerHTML=`<div class="eyebrow">Pytanie ${step+1} z ${questions.length}</div><div class="progress"><div class="fill" style="width:${(step+1)/questions.length*100}%"></div></div><h2>${q[0]}</h2><p class="muted">Wybierz odpowiedź, która najbardziej do Ciebie pasuje.</p><div class="answers">${q.slice(1).map((a,i)=>`<button class="answer ${answers[step]===i?'selected':''}" data-choice="${i}" aria-pressed="${answers[step]===i}">${a}</button>`).join('')}</div><div class="buttons"><button class="btn secondary" id="back">← Wstecz</button><button class="btn" id="next" ${answers[step]===null?'disabled':''}>${step===questions.length-1?'Zobacz wynik':'Dalej →'}</button></div>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.choice);render()});document.getElementById('back').onclick=()=>{step--;render()};document.getElementById('next').onclick=()=>{if(answers[step]!==null){step++;render()}}}
render();
</script></body></html>
